<ng-template #alertHost></ng-template>
<section aria-labelledby="live-casino-title">
    <ng-container *ngIf="urlSafe">
        <div>
            <button class="game-close-btn" type="button" aria-label="Close game" (click)="subtabClose()"> ✕ </button>
            <iframe #gameIframe class="game-iframe" scrolling="auto" frameborder="0" allowfullscreen
                title="Live casino game" [src]="urlSafe"></iframe>
        </div>
        <button type="button" class="iframe_fullS_icon ml-4" aria-label="Toggle fullscreen"
            (click)="toggleFullScreen()"><i class="fas fa-expand-arrows-alt iframe_fullS_icon ml-4"
                aria-hidden="true"></i></button>
    </ng-container>
    <div>
        <div class="redirectline" aria-label="Breadcrumb"><span routerLink="/home">Home</span> <img
                src="assets/home_icons/arrow_right.png" alt=" " loading="lazy" aria-hidden="true" width="15"
                height="15"> <span>Live Casino </span> </div>

        <div>
            <div class="home_live_casino_head">
                <h2 id="live-casino-title-compo" class="main_heading live_casino_title">Live Casino</h2>
            </div>
            <p class="main_para">At Raj Poker, there are live casino with big prizes </p>
        </div>

        <div class="dis_flex_main" role="tablist" aria-label="Casino providers">
            <!-- <button type="button" class="main_provider_div" role="tab" [attr.aria-selected]="ProviderName === 'Ezugi'"
                (click)="torrobtn('Ezugi')">
              
                <span class="radio_btn" [class.active]="ProviderName === 'Ezugi'"></span>
                EZUGI
            </button> -->
            <button type="button" class="main_provider_div" role="tab"
                [attr.aria-selected]="ProviderName === 'Evolution'" (click)="torrobtn('Evolution')">
                <!-- <button *ngIf="commonUtilSvc.hasPermission('evolutiongv')" type="button" class="main_provider_div" role="tab"
                [attr.aria-selected]="ProviderName === 'Evolution'" (click)="torrobtn('Evolution')"> -->

                <span class="radio_btn" [class.active]="ProviderName === 'Evolution'"></span>
                EVOLUTION
            </button>
            <button type="button" class="main_provider_div" role="tab" [attr.aria-selected]="ProviderName === 'Ezugi'"
                (click)="torrobtn('Ezugi')">
                <!-- <button  *ngIf="commonUtilSvc.hasPermission('ezugigv')" type="button" class="main_provider_div" role="tab" [attr.aria-selected]="ProviderName === 'Ezugi'"
                (click)="torrobtn('Ezugi')"> -->
                <span class="radio_btn" [class.active]="ProviderName === 'Ezugi'"></span>
                EZUGI
            </button>
            <button type="button" class="main_provider_div" role="tab"
                [attr.aria-selected]="ProviderName === 'vivogaming'" (click)="torrobtn('vivogaming')">
                <!-- <button *ngIf="commonUtilSvc.hasPermission('vivogaming')" type="button" class="main_provider_div" role="tab"
                [attr.aria-selected]="ProviderName === 'vivogaming'" (click)="torrobtn('vivogaming')"> -->

                <span class="radio_btn" [class.active]="ProviderName === 'vivogaming'"></span>
                VIVOGAMING
            </button>
            <!-- <button  *ngIf="commonUtilSvc.hasPermission('pragmaticplaylivecasino')" type="button" class="main_provider_div" role="tab"
                [attr.aria-selected]="ProviderName === 'PragmaticPlay'" (click)="torrobtn('PragmaticPlay')"> -->
            <!-- (click)="providerChange('Evolution')"> -->
            <!-- <button   type="button" class="main_provider_div" role="tab"
                [attr.aria-selected]="ProviderName === 'PragmaticPlay'" (click)="torrobtn('PragmaticPlay')">
                <span class="radio_btn" [class.active]="ProviderName === 'PragmaticPlay'"></span>
                PRAGMATICPLAY
            </button> -->
        </div>

        <div class="mt-4">
            <div class="Maingame_row_live trending_scroll_container"
                *ngIf="ProviderName == 'Ezugi'  || ProviderName == 'Evolution'" aria-label="Ezugi live casino games">
                <article class="Games_image_box" (click)="gvproviderapi(game)"
                    *ngFor="let game of torrogames; let i = index  ">
                    <img class="img_w" [src]="getGameImage(game, i)" [alt]="game.title + ' live casino game'"
                        loading="lazy" style="aspect-ratio: 2/2;" />
                    <!-- <div class="game_titles">    {{ game.title }} </div> -->

                    <div class="play_container">
                        <button type="button" aria-label="Play {{ game.title }}">
                            <img src="assets/home_icons/live_casino/play_icon.png" alt="" aria-hidden="true"
                                loading="lazy" />
                        </button>
                    </div>
                </article>

            </div>
            <div class="Maingame_row_live trending_scroll_container" *ngIf="ProviderName == 'vivogaming' "
                aria-label="Ezugi live casino games">
                <article class="Games_image_box" (click)="vivogameLaunch(game)" *ngFor="let game of torrogames  ">
                    <img class="img_w" src="assets/games/vivogaming/{{game.gameId}}_230.webp"
                        [alt]="game.title + ' live casino game'" loading="lazy" />
                    <div class="play_container">
                        <button type="button" aria-label="Play {{ game.title }}">
                            <img src="assets/home_icons/live_casino/play_icon.png" alt="" aria-hidden="true"
                                loading="lazy" />
                        </button>
                    </div>
                </article>

            </div>

            <div class="Maingame_row_live trending_scroll_container" *ngIf="ProviderName == 'PragmaticPlay' ">
                <ng-container *ngFor="let game of pragmaticLivecasino  ">
                    <article class="Games_image_box" *ngIf="game.tableName !== 'BACCARAT_MULTIPLAY'"
                        (click)="Pragmaticgamesres(game.tableName, game.tableId)">
                        <img class="img_w" [src]="game.tableImage" [alt]="game.title + ' live casino game'"
                            loading="lazy" style="aspect-ratio: 2/2;" />
                        <div class="game_titles">
                            {{ game.tableName }}
                        </div>

                        <div class="play_container" aria-label="Play {{ game.title }}">
                            <button type="button">
                                <img src="assets/home_icons/live_casino/play_icon.png" alt=""
                                    aria-hidden="true" loading="lazy" />
                            </button>
                        </div>
                    </article>
                </ng-container>

            </div>
        </div>

    </div>
</section>
